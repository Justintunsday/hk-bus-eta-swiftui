name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS app
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project HKBusETA.xcodeproj \
            -scheme HKBusETA \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive for iOS device (unsigned)
        run: |
          xcodebuild \
            -project HKBusETA.xcodeproj \
            -scheme HKBusETA \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HKBusETA.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload HKBusETA-unsigned.ipa
          mkdir -p Payload
          cp -R HKBusETA.xcarchive/Products/Applications/HKBusETA.app Payload/
          zip -qry HKBusETA-unsigned.ipa Payload
          ls -lh HKBusETA-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HKBusETA-unsigned-ipa
          path: ${{ runner.temp }}/HKBusETA-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
