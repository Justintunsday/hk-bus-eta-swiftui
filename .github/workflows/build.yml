name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS app
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild() {
            command xcodebuild \
              -project HKBusETA.xcodeproj \
              -scheme HKBusETA \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -resultBundlePath "$RUNNER_TEMP/HKBusETA.xcresult" \
              CODE_SIGNING_ALLOWED=NO \
              "$@"
          }
          for attempt in 1 2 3; do
            echo "Simulator build attempt $attempt"
            rm -rf "$RUNNER_TEMP/HKBusETA.xcresult"
            if xcodebuild build; then
              exit 0
            fi
            echo "Attempt $attempt failed (possible Xcode build-system crash), retrying..."
            sleep 10
          done
          echo "=== DiagnosticReports ==="
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            echo "--- $f"
            python3 - "$f" <<'PY'
import json, sys
with open(sys.argv[1]) as fh:
    parts = fh.read().split("\n", 1)
meta = json.loads(parts[0])
payload = json.loads(parts[1])
print("process:", meta.get("app_name"), meta.get("bug_type"))
print("exception:", payload.get("exception"))
print("termination:", payload.get("termination"))
faulting = payload.get("faultingThread", 0)
threads = payload.get("threads", [])
images = payload.get("usedImages", [])
if 0 <= faulting < len(threads):
    for fr in threads[faulting].get("frames", [])[:35]:
        img = images[fr["imageIndex"]] if fr.get("imageIndex") is not None and fr["imageIndex"] < len(images) else {}
        print("   ", img.get("name", "?"), fr.get("symbol", "?"), "+", fr.get("imageOffset"))
PY
          done
          echo "=== xcresult console ==="
          xcrun xcresulttool get log --path "$RUNNER_TEMP/HKBusETA.xcresult" --type console 2>&1 | tail -300 || true
          exit 1

      - name: Archive for iOS device (unsigned)
        run: |
          for attempt in 1 2 3; do
            echo "Archive attempt $attempt"
            if xcodebuild \
              -project HKBusETA.xcodeproj \
              -scheme HKBusETA \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/HKBusETA.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              archive; then
              exit 0
            fi
            echo "Attempt $attempt failed (possible Xcode build-system crash), retrying..."
            rm -rf "$RUNNER_TEMP/HKBusETA.xcarchive"
            sleep 10
          done
          exit 1

      - name: Package unsigned IPA
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload HKBusETA-unsigned.ipa
          mkdir -p Payload
          cp -R HKBusETA.xcarchive/Products/Applications/HKBusETA.app Payload/
          zip -qry HKBusETA-unsigned.ipa Payload
          ls -lh HKBusETA-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: HKBusETA-unsigned-ipa
          path: ${{ runner.temp }}/HKBusETA-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
